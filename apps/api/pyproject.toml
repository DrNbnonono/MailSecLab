[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mailtrace-api"
version = "0.5.0"
description = "Local HTTP API for the MailTrace investigation engine"
requires-python = ">=3.11"
dependencies = ["mailtrace-core==0.1.0", "mailtrace-lab==0.1.0", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.20,<1"]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]
