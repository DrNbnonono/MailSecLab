[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mailtrace-lab"
version = "0.1.0"
description = "Reproducible mail header generation, evidence differences and archives"
requires-python = ">=3.11"
dependencies = ["mailtrace-core==0.1.0"]

[project.scripts]
mailtrace-lab = "mailtrace_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
