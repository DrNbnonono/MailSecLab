services:

  postfix1:
    build:
      context: ./postfix
    container_name: postfix1
    hostname: postfix1.lab.test
    environment:
      MYHOSTNAME: postfix1.lab.test
      RELAYHOST: "[postfix2]:25"
      HOPCOUNT_LIMIT: "50"
    networks:
      - mailnet
    depends_on:
      - postfix2

  postfix2:
    build:
      context: ./postfix
    container_name: postfix2
    hostname: postfix2.lab.test
    environment:
      MYHOSTNAME: postfix2.lab.test
      RELAYHOST: "[postfix3]:25"
      HOPCOUNT_LIMIT: "50"
    networks:
      - mailnet
    depends_on:
      - postfix3

  postfix3:
    build:
      context: ./postfix
    container_name: postfix3
    hostname: postfix3.lab.test
    environment:
      MYHOSTNAME: postfix3.lab.test
      RELAYHOST: "[mailpit]:1025"
      HOPCOUNT_LIMIT: "50"
    networks:
      - mailnet
    depends_on:
      - mailpit

  mailpit:
    # pinned: v1.31.0 (freeze 2026-09-01, hub digest sha256:c96991d9...ce24;
    # digest reference degraded to tag because the daemon cannot reach
    # registries through the current proxy — image was loaded out-of-band)
    image: axllent/mailpit:v1.31.0
    container_name: mailpit
    hostname: mailpit.lab.test
    ports:
      - "127.0.0.1:8025:8025"
    networks:
      - mailnet

  # ---- PF_CURRENT chain (Postfix 3.11.x from debian:sid) ----
  # started only with: docker compose --profile pf11 up -d
  postfix1n:
    build:
      context: ./postfix-current
      network: host
    container_name: postfix1n
    hostname: postfix1n.lab.test
    environment:
      MYHOSTNAME: postfix1n.lab.test
      RELAYHOST: "[postfix2n]:25"
      HOPCOUNT_LIMIT: "50"
    networks:
      - mailnet
    depends_on:
      - postfix2n
    profiles:
      - pf11

  postfix2n:
    build:
      context: ./postfix-current
      network: host
    container_name: postfix2n
    hostname: postfix2n.lab.test
    environment:
      MYHOSTNAME: postfix2n.lab.test
      RELAYHOST: "[postfix3n]:25"
      HOPCOUNT_LIMIT: "50"
    networks:
      - mailnet
    depends_on:
      - postfix3n
    profiles:
      - pf11

  postfix3n:
    build:
      context: ./postfix-current
      network: host
    container_name: postfix3n
    hostname: postfix3n.lab.test
    environment:
      MYHOSTNAME: postfix3n.lab.test
      RELAYHOST: "[mailpit]:1025"
      HOPCOUNT_LIMIT: "50"
    networks:
      - mailnet
    depends_on:
      - mailpit
    profiles:
      - pf11

  client:
    build:
      context: ./client
    container_name: mail-client
    hostname: client.lab.test
    networks:
      - mailnet
    depends_on:
      - postfix1
    volumes:
      - ./scripts:/scripts
      - ./results:/results

  # ---- Phase 3B: alternative MTAs, same corpus (single-hop smarthost -> mailpit) ----
  exim:
    build:
      context: ./exim
      network: host
    container_name: exim
    hostname: exim.lab.test
    networks:
      - mailnet
    depends_on:
      - mailpit
    profiles:
      - mta3b

  opensmtpd:
    build:
      context: ./opensmtpd
      network: host
    container_name: opensmtpd
    hostname: opensmtpd.lab.test
    networks:
      - mailnet
    depends_on:
      - mailpit
    profiles:
      - mta3b

  # ---- Phase 3C: header parsers over the same corpus ----
  parser-node:
    build:
      context: ./parsers/node
      network: host
    container_name: parser-node
    volumes:
      - ./scripts:/scripts
      - ./results:/results
    profiles:
      - parsers

  parser-go:
    build:
      context: ./parsers/go
      network: host
    container_name: parser-go
    volumes:
      - ./scripts:/scripts
      - ./results:/results
    profiles:
      - parsers

  # ---- F-series: rspamd offline scanner (DNS-dependent checks disabled) ----
  rspamd:
    build:
      context: ./rspamd
      network: host
    container_name: rspamd
    volumes:
      - ./results:/results
    profiles:
      - frspamd

networks:
  mailnet:
    driver: bridge