# Minimal permissive smarthost config for the lab:
# - accepts EVERYTHING from the lab network (no header_syntax / hopcount ACL),
#   so the differential against Postfix measures Exim's own defaults.
primary_hostname = exim.lab.test
log_file_path = /var/log/exim4/%s
domainlist local_domains = @
hostlist relay_from_hosts = 0.0.0.0/0
acl_smtp_rcpt = acl_check_rcpt
acl_smtp_data = acl_check_data

begin acl

acl_check_rcpt:
  accept

acl_check_data:
  accept

begin routers

smart_route:
  driver = manualroute
  route_list = * mailpit byname
  transport = to_mailpit
  no_more

begin transports

to_mailpit:
  driver = smtp
  port = 1025

begin retry

* * F,2h,15m; G,16h,1h,1.5; F,4d,6h
